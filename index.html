    <!-- Theme initialization before first paint (no flash, follows device if no saved manual choice) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('radar.theme');
          var isDark = true;
          if (saved === 'light') {
            isDark = false;
          } else if (saved === 'dark') {
            isDark = true;
          } else if (typeof window !== 'undefined' && window.matchMedia) {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          var root = document.documentElement;
          var themeColor = isDark ? '#0b1220' : '#f5f7fa';
          if (isDark) {
            root.classList.remove('light');
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
            root.style.backgroundColor = '#0b1220';
            root.style.color = '#ffffff';
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
            root.setAttribute('data-theme', 'light');
            root.style.backgroundColor = '#f5f7fa';
            root.style.color = '#1a1a2e';
          }
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) {
            metaTheme.setAttribute('content', themeColor);
          }
        } catch (e) {}
      })();
    </script>
